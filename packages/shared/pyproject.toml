[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "inky-image-display-shared"
version = "6.2.1"
description = "Shared models and schemas for Inky Image Display services."
authors = [
    { name = "stkr22", email = "stkr22@github.com" }
]
license = "GPL-3.0-only"
dependencies = [
    "pydantic~=2.13.4",
    "rich~=15.0.0",
    "sqlmodel~=0.0.39",
    "pillow~=12.3.0",
    "pillow-heif~=1.5.0",
    "coloraide~=8.12.1",
    "google-genai~=2.19.0",
]
