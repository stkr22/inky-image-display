[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "inky-image-display-api"
version = "0.14.0"
description = "FastAPI service for Inky Image Display device and image management."
authors = [
    { name = "stkr22", email = "stkr22@github.com" }
]
license = "GPL-3.0-only"
dependencies = [
    "inky-image-display-shared~=3.0",
    "fastapi~=0.141.1",
    "uvicorn[standard]~=0.52.4",
    "httpx2~=2.12.0",
    "minio~=7.2.20",
    "pydantic~=2.13.4",
    "pydantic-settings~=2.15.0",
    "sqlmodel~=0.0.39",
    "aiosqlite~=0.22.1",
    "alembic~=1.19.1",
    "python-multipart~=0.0.32",
    "pillow~=12.3.0",
    "pillow-heif~=1.5.0",
    "aiomqtt~=2.5.1",
    "qrcode~=8.2",
    "authlib~=1.7.2",
    "itsdangerous~=2.2.0",
    "cronsim~=2.7",
]

[project.scripts]
inky-image-display-api = "inky_image_display_api.main:main"

[tool.uv.sources]
inky-image-display-shared = { workspace = true }
