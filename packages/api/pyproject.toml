[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[project]
name = "inky-image-display-api"
version = "0.14.0"
description = "FastAPI service for Inky Image Display device and image management."
authors = [
    { name = "stkr22", email = "stkr22@github.com" }
]
license = "GPL-3.0-only"
dependencies = [
    "inky-image-display-shared~=3.0",
    "fastapi~=0.162.4",
    "uvicorn[standard]~=0.52.4",
    "httpx2~=2.16.0",
    "minio~=7.2.20",
    "pydantic~=2.14.3",
    "pydantic-settings~=2.16.2",
    "sqlmodel~=0.0.49",
    # SQLAlchemy 2.1 stopped pulling in greenlet by default; the async engine
    # raises ImportError at import time without the asyncio extra.
    "sqlalchemy[asyncio]~=2.1.8",
    "aiosqlite~=0.22.1",
    "alembic~=1.20.1",
    "python-multipart~=0.0.32",
    "pillow~=13.0.0",
    "pillow-heif~=1.8.1",
    "aiomqtt~=2.5.1",
    "qrcode~=8.2",
    "authlib~=1.9.5",
    "itsdangerous~=2.2.0",
    "cronsim~=2.8",
]

[project.scripts]
inky-image-display-api = "inky_image_display_api.main:main"

[tool.uv.sources]
inky-image-display-shared = { workspace = true }
