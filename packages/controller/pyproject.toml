[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "inky-image-display-controller"
version = "4.6.2"
description = "Device-side controller for Inky e-ink picture displays."
authors = [
    { name = "stkr22", email = "stkr22@github.com" }
]
license = "GPL-3.0-only"
dependencies = [
    "inky-image-display-shared~=3.0",
    "aiomqtt~=2.5.1",
    "httpx2~=2.12.0",
    "minio~=7.2.20",
    "pillow~=12.3.0",
    "pydantic~=2.13.4",
    "pydantic-settings~=2.15.0",
    "pyyaml~=6.0.3",
    "typer~=0.27.1",
]

[project.optional-dependencies]
rpi = ["inky~=2.4.0"]

[project.scripts]
inky-image-display-controller = "inky_image_display_controller.main:app"

[tool.uv.sources]
inky-image-display-shared = { workspace = true }
