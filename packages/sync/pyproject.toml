[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[project]
name = "inky-image-display-sync"
version = "0.14.0"
description = "Immich image sync service for Inky Image Display."
authors = [
    { name = "stkr22", email = "stkr22@github.com" }
]
license = "GPL-3.0-only"
dependencies = [
    "inky-image-display-shared~=3.0",
    "typer~=0.29.1",
    "httpx2~=2.16.0",
    "minio~=7.2.20",
    "pydantic~=2.14.3",
    "pydantic-settings~=2.16.2",
    "aiomqtt~=2.5.1",
    "pillow~=13.0.0",
    "urllib3~=2.8.0",
]

[project.scripts]
inky-image-display-sync = "inky_image_display_sync.main:app"

[tool.uv.sources]
inky-image-display-shared = { workspace = true }
