[project]
name = "inky-image-display-workspace"
version = "7.2.1"
description = "Workspace root for Inky Image Display services."
authors = [
    { name = "stkr22", email = "stkr22@github.com" }
]
license = "GPL-3.0-only"
requires-python = ">=3.13,<3.15"

[tool.uv.workspace]
members = ["packages/*"]
# packages/web is the React frontend (npm), not a Python workspace member.
exclude = ["packages/web"]

# CVE-2026-45409 affects idna < 3.15. Pin via override because idna only
# enters the dependency tree transitively (httpx2/requests/anyio). The floor is
# 3.18 rather than 3.15 because an override *replaces* every requirement on
# idna, and httpx2 itself asks for >=3.18 — a lower floor here would silently
# undercut it.
[tool.uv]
override-dependencies = ["idna>=3.18"]

[dependency-groups]
dev = [
    "ruff~=0.16.4",
    "ty~=0.0.74",
    "pytest~=9.1.1",
    "pytest-cov~=7.1.0",
    "pytest-asyncio~=1.4.0",
    "pytest-timeout~=2.4.0",
    "aiosqlite~=0.22.1",
    "pillow~=12.3.0",
]

[tool.ty.rules]
possibly-unresolved-reference = "warn"
unused-ignore-comment = "warn"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "-q"]
testpaths = [
    "packages/sync/tests",
    "packages/controller/tests",
    "packages/api/tests",
]
asyncio_mode = "auto"
timeout = "30"

[tool.ruff]
line-length = 120
# ruff 0.16 formats Python blocks inside Markdown. The docs quote upstream
# driver code verbatim to explain third-party bugs, so reformatting them would
# silently misrepresent what upstream actually wrote.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "W",    # pycodestyle warnings (complement to E)
    "Q",    # flake8-quotes (enforce consistent quote style)
    "TID",  # flake8-tidy-imports (better import practices)
    "ICN",  # flake8-import-conventions (e.g., import pandas as pd)
    "PIE",  # flake8-pie (misc linting improvements)
    "ERA",  # eradicate
    "PL",   # pylint
    "RUF",  # ruff-specific rules
    "TC",   # flake8-type-checking
    "ASYNC",  # flake8-async (async/await best practices)
    "FAST", # FastAPI-specific rules
    "D",    # pydocstyle (docstring conventions)
]
ignore = [
    "E203",
    "D203",  # Incompatible with D211 (no-blank-line-before-class)
    "D213",  # Incompatible with D212 (multi-line-summary-first-line)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101", "PLR2004", "D", "ARG002", "ASYNC240"]
"packages/*/tests/**/*.py" = ["S101", "PLR2004", "D", "ARG002", "ASYNC240"]
"scripts/**/*.py" = ["T201", "D", "PLR2004", "PLR0913", "PLW2901", "PTH123", "BLE001"]
"**/migrations/*.py" = ["E501"]
"**/routes/*.py" = ["PLR0913"]
